<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sledovač Voleb LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tech: {
                            base: '#0B0F17',
                            card: '#131B2A',
                            border: '#1E293B',
                            accent: '#38BDF8',
                            success: '#10B981',
                            warning: '#F59E0B'
                        }
                    },
                    fontFamily: { mono: ['JetBrains Mono', 'Fira Code', 'monospace'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #070A0F; }
        .tech-glow-card { border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5); }
        select option { background-color: #131B2A; color: #E2E8F0; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col p-4 md:p-6">

    <!-- Header -->
    <header class="max-w-7xl w-full mx-auto mb-4 bg-tech-card/80 backdrop-blur border border-tech-border rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tech-accent opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-tech-accent"></span>
            </div>
            <div>
                <h1 class="font-mono font-bold text-lg tracking-wider text-white uppercase flex items-center gap-2">
                    <span>LIVE</span> <span class="text-tech-accent">//</span> ONLINE_ELECTION_MONITOR
                </h1>
                <p class="text-xs text-slate-400 font-mono" id="xml-status">Načítám data z volby.cz...</p>
            </div>
        </div>

        <div class="flex items-center gap-4 text-xs font-mono bg-tech-base px-4 py-2 rounded-lg border border-tech-border">
            <div>
                <span class="text-slate-400">OBNOVENÍ ZA:</span>
                <span id="timer" class="text-tech-accent font-bold ml-2">15s</span>
            </div>
        </div>

        <button onclick="fetchXMLData()" class="font-mono text-xs font-semibold px-4 py-2 bg-tech-accent/10 hover:bg-tech-accent/20 text-tech-accent border border-tech-accent/40 rounded-lg transition-all">
            OBNOVIT TEĎ
        </button>
    </header>

    <!-- URL Config Bar -->
    <div class="max-w-7xl w-full mx-auto mb-6 bg-tech-card/40 border border-tech-border p-3 rounded-xl flex gap-3 items-center text-xs font-mono">
        <span class="text-slate-400">Zdroj ČSÚ:</span>
        <input type="text" id="target-xml-url" value="https://www.volby.cz/pls/ps2021/vysledky.xml" class="flex-grow bg-tech-base border border-tech-border px-3 py-1.5 rounded text-slate-200 focus:outline-none focus:border-tech-accent">
    </div>

    <!-- Main Grid -->
    <main class="max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow">
        
        <!-- SLOUPCE 1 -->
        <section class="bg-tech-card/60 border border-tech-border rounded-xl p-4 flex flex-col h-[700px]">
            <div class="pb-3 border-b border-tech-border mb-4">
                <span class="text-xs text-tech-accent font-mono">SLOUPEC 01</span>
                <h2 class="font-bold text-base text-slate-100 uppercase">Obec / Okrsek A</h2>
            </div>
            <div class="mb-4">
                <select id="select-col-1" onchange="renderColumn(1)" class="w-full bg-tech-base border border-tech-border text-xs rounded-lg p-2.5 text-slate-200 font-mono">
                    <option value="">-- Čekám na data --</option>
                </select>
            </div>
            <div id="col-container-1" class="space-y-4 overflow-y-auto pr-1 flex-grow pt-2"></div>
        </section>

        <!-- SLOUPCE 2 -->
        <section class="bg-tech-card/60 border border-tech-border rounded-xl p-4 flex flex-col h-[700px]">
            <div class="pb-3 border-b border-tech-border mb-4">
                <span class="text-xs text-tech-accent font-mono">SLOUPEC 02</span>
                <h2 class="font-bold text-base text-slate-100 uppercase">Obec / Okrsek B</h2>
            </div>
            <div class="mb-4">
                <select id="select-col-2" onchange="renderColumn(2)" class="w-full bg-tech-base border border-tech-border text-xs rounded-lg p-2.5 text-slate-200 font-mono">
                    <option value="">-- Čekám na data --</option>
                </select>
            </div>
            <div id="col-container-2" class="space-y-4 overflow-y-auto pr-1 flex-grow pt-2"></div>
        </section>

        <!-- SLOUPCE 3: SENÁT -->
        <section class="bg-tech-card/60 border border-purple-900/50 rounded-xl p-4 flex flex-col h-[700px] lg:border-l-2 lg:border-l-purple-500/50">
            <div class="pb-3 border-b border-tech-border mb-4">
                <span class="text-xs text-purple-400 font-mono">SLOUPEC 03</span>
                <h2 class="font-bold text-base text-purple-200 uppercase">Senátní obvod</h2>
            </div>
            <div class="mb-4">
                <select id="select-col-3" onchange="renderColumn(3)" class="w-full bg-tech-base border border-purple-900/60 text-xs rounded-lg p-2.5 text-slate-200 font-mono">
                    <option value="">-- Čekám na senátní obvody --</option>
                </select>
            </div>
            <div id="col-container-3" class="space-y-4 overflow-y-auto pr-1 flex-grow pt-2"></div>
        </section>

    </main>

    <script>
        let parsedXmlData = null;

        async function fetchXMLData() {
            const rawUrl = document.getElementById('target-xml-url').value;
            const statusEl = document.getElementById('xml-status');

            // Propojení přes veřejný CORS proxy
            const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(rawUrl);

            try {
                statusEl.innerText = "Stahuji živá data z ČSÚ...";
                const response = await fetch(proxyUrl + '&_t=' + new Date().getTime());
                
                if (!response.ok) throw new Error("Chyba při stahování.");

                const str = await response.text();
                const parser = new DOMParser();
                parsedXmlData = parser.parseFromString(str, "text/xml");

                statusEl.innerText = "Živá data načtena v " + new Date().toLocaleTimeString();
                statusEl.className = "text-xs text-tech-success font-mono";

                populateDropdowns();

            } catch (err) {
                statusEl.innerText = "Chyba připojení k ČSÚ (soubor ještě neexistuje nebo je nepropojený).";
                statusEl.className = "text-xs text-tech-warning font-mono";
            }
        }

        function populateDropdowns() {
            if (!parsedXmlData) return;

            const obceNodes = parsedXmlData.querySelectorAll('OBEC');
            const senatNodes = parsedXmlData.querySelectorAll('SENAT_OBVOD, OBVOD');

            [1, 2].forEach(colId => {
                const select = document.getElementById(`select-col-${colId}`);
                const currentVal = select.value;
                select.innerHTML = '<option value="">-- Vyberte obec z ČSÚ --</option>';

                obceNodes.forEach(obec => {
                    const nazev = obec.getAttribute('NAZ_OBCE') || obec.getAttribute('NAZEV') || 'Obec';
                    const kod = obec.getAttribute('KOD_OBCE') || obec.getAttribute('KOD');
                    
                    const opt = document.createElement('option');
                    opt.value = kod;
                    opt.innerText = `${nazev} (${kod})`;
                    select.appendChild(opt);
                });

                if (currentVal) select.value = currentVal;
            });

            const selectSenat = document.getElementById('select-col-3');
            const currentSenatVal = selectSenat.value;
            selectSenat.innerHTML = '<option value="">-- Vyberte senátní obvod --</option>';

            senatNodes.forEach(obvod => {
                const cislo = obvod.getAttribute('CISLO') || obvod.getAttribute('NUM');
                const nazev = obvod.getAttribute('NAZEV') || `Obvod č. ${cislo}`;
                
                const opt = document.createElement('option');
                opt.value = cislo;
                opt.innerText = `Obvod č. ${cislo} (${nazev})`;
                selectSenat.appendChild(opt);
            });

            if (currentSenatVal) selectSenat.value = currentSenatVal;

            renderColumn(1);
            renderColumn(2);
            renderColumn(3);
        }

        function renderColumn(colId) {
            const select = document.getElementById(`select-col-${colId}`);
            const container = document.getElementById(`col-container-${colId}`);
            const selectedVal = select.value;

            if (!selectedVal) {
                container.innerHTML = `<div class="p-4 bg-tech-base/40 rounded border border-tech-border/40 text-center text-xs font-mono text-slate-500">Vyberte položku ze seznamu ČSÚ.</div>`;
                return;
            }

            const selectedText = select.options[select.selectedIndex].text;
            let isProcessed = false;
            let resultsHtml = '';

            if (parsedXmlData) {
                const targetNode = parsedXmlData.querySelector(`OBEC[KOD_OBCE="${selectedVal}"], OBEC[KOD="${selectedVal}"], SENAT_OBVOD[CISLO="${selectedVal}"]`);
                
                if (targetNode) {
                    const strany = targetNode.querySelectorAll('STRANA, KANDIDAT');
                    if (strany.length > 0) {
                        isProcessed = true;
                        resultsHtml = Array.from(strany).map(s => {
                            const nazev = s.getAttribute('NAZ_STR') || s.getAttribute('JMENO') || 'Kandidát';
                            const proc = s.getAttribute('PROC_HLASU') || s.getAttribute('PROC') || '0';
                            const hlasy = s.getAttribute('HLASY') || '0';
                            return `
                                <div class="mb-2">
                                    <div class="flex justify-between text-xs font-mono mb-1">
                                        <span class="text-slate-300 font-semibold">${nazev}</span>
                                        <span class="text-slate-400">${proc}% <span class="text-slate-500">(${hlasy} h.)</span></span>
                                    </div>
                                    <div class="w-full h-1.5 bg-tech-base rounded-full overflow-hidden">
                                        <div class="h-full bg-tech-accent rounded-full" style="width: ${proc}%"></div>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    }
                }
            }

            if (isProcessed) {
                container.innerHTML = `
                    <div class="tech-glow-card bg-tech-base/80 p-4 rounded-lg">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-sm text-slate-100">${selectedText}</h3>
                            <span class="px-2 py-0.5 rounded text-[10px] font-mono font-semibold bg-tech-success/10 text-tech-success border border-tech-success/30">SPOČTENO</span>
                        </div>
                        <div class="space-y-2 mt-4">${resultsHtml}</div>
                    </div>`;
            } else {
                container.innerHTML = `
                    <div class="tech-glow-card bg-tech-base/80 p-4 rounded-lg">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-sm text-slate-100">${selectedText}</h3>
                            <span class="px-2 py-0.5 rounded text-[10px] font-mono font-semibold bg-tech-warning/10 text-tech-warning border border-tech-warning/30 animate-pulse">SČÍTÁ SE</span>
                        </div>
                        <div class="p-4 bg-tech-base/40 rounded border border-tech-border/40 text-center text-xs font-mono text-slate-500">
                            V XML zatial neboli zverejnené hlasy pre túto položku.
                        </div>
                    </div>`;
            }
        }

        let timerVal = 15;
        setInterval(() => {
            timerVal--;
            if (timerVal <= 0) {
                timerVal = 15;
                fetchXMLData();
            }
            document.getElementById('timer').innerText = timerVal + 's';
        }, 1000);

        window.onload = fetchXMLData;
    </script>
</body>
</html>
