<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sledovač Voleb 2026 LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tech: {
                            base: '#0B0F17',
                            card: '#131B2A',
                            border: '#1E293B',
                            accent: '#38BDF8',
                            success: '#10B981',
                            warning: '#F59E0B'
                        }
                    },
                    fontFamily: { mono: ['JetBrains Mono', 'Fira Code', 'monospace'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #070A0F; }
        .tech-glow-card { border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5); }
        select option { background-color: #131B2A; color: #E2E8F0; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0B0F17; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 3px; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col p-4 md:p-6 lg:p-8">

    <!-- Header -->
    <header class="max-w-7xl w-full mx-auto mb-6 bg-tech-card/80 backdrop-blur border border-tech-border rounded-xl p-5 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tech-accent opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-tech-accent"></span>
            </div>
            <div>
                <h1 class="font-mono font-bold text-xl md:text-2xl tracking-wider text-white uppercase flex items-center gap-2">
                    <span>LIVE</span> <span class="text-tech-accent">//</span> VOLBY.GOV.CZ_MONITOR_2026
                </h1>
                <p class="text-sm text-slate-400 font-mono" id="xml-status">Připojování k volby.gov.cz...</p>
            </div>
        </div>

        <div class="flex items-center gap-4 text-sm font-mono bg-tech-base px-4 py-2.5 rounded-lg border border-tech-border">
            <div>
                <span class="text-slate-400">AUTOMATICKÉ OBNOVENÍ ZA:</span>
                <span id="timer" class="text-tech-accent font-bold ml-2">15s</span>
            </div>
        </div>

        <button onclick="fetchAllData()" class="font-mono text-sm font-semibold px-5 py-2.5 bg-tech-accent/10 hover:bg-tech-accent/20 text-tech-accent border border-tech-accent/40 rounded-lg transition-all active:scale-95">
            OBNOVIT TEĎ
        </button>
    </header>

    <!-- URL Config Bar -->
    <div class="max-w-7xl w-full mx-auto mb-6 bg-tech-card/40 border border-tech-border p-4 rounded-xl flex flex-col xl:flex-row gap-3 items-center text-sm font-mono">
        <span class="text-slate-400 shrink-0">Zdroj Obecní (KV2026):</span>
        <input type="text" id="target-kv-url" value="https://volby.gov.cz/appdata/kv2026/20261009/odata/vysledky.xml" class="w-full bg-tech-base border border-tech-border px-3 py-2 rounded text-slate-200 focus:outline-none focus:border-tech-accent">
        
        <span class="text-slate-400 shrink-0 xl:ml-3">Zdroj Senát (SE2026):</span>
        <input type="text" id="target-se-url" value="https://volby.gov.cz/appdata/se2026/20261009/odata/vysledky.xml" class="w-full bg-tech-base border border-tech-border px-3 py-2 rounded text-slate-200 focus:outline-none focus:border-purple-500">
    </div>

    <!-- Main Grid -->
    <main class="max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow">
        
        <!-- SLOUPCE 1: OBEC A -->
        <section class="bg-tech-card/60 border border-tech-border rounded-xl p-5 flex flex-col h-[750px]">
            <div class="pb-3.5 border-b border-tech-border mb-4 flex items-center justify-between">
                <div>
                    <span class="text-xs text-tech-accent font-mono">SLOUPEC 01</span>
                    <h2 id="title-col-1" class="font-bold text-xl text-slate-100 uppercase truncate max-w-[280px]">Obec A</h2>
                </div>
            </div>
            <div class="mb-4 relative">
                <select id="select-col-1" onchange="renderColumn(1)" class="w-full bg-tech-base border border-tech-border text-sm rounded-lg p-3 text-slate-200 font-mono focus:outline-none focus:border-tech-accent">
                    <option value="">-- Čekám na data obcí --</option>
                </select>
            </div>
            <div id="col-container-1" class="space-y-4 overflow-y-auto pr-1 flex-grow pt-2"></div>
        </section>

        <!-- SLOUPCE 2: OBEC B -->
        <section class="bg-tech-card/60 border border-tech-border rounded-xl p-5 flex flex-col h-[750px]">
            <div class="pb-3.5 border-b border-tech-border mb-4 flex items-center justify-between">
                <div>
                    <span class="text-xs text-tech-accent font-mono">SLOUPEC 02</span>
                    <h2 id="title-col-2" class="font-bold text-xl text-slate-100 uppercase truncate max-w-[280px]">Obec B</h2>
                </div>
            </div>
            <div class="mb-4 relative">
                <select id="select-col-2" onchange="renderColumn(2)" class="w-full bg-tech-base border border-tech-border text-sm rounded-lg p-3 text-slate-200 font-mono focus:outline-none focus:border-tech-accent">
                    <option value="">-- Čekám na data obcí --</option>
                </select>
            </div>
            <div id="col-container-2" class="space-y-4 overflow-y-auto pr-1 flex-grow pt-2"></div>
        </section>

        <!-- SLOUPCE 3: SENÁT -->
        <section class="bg-tech-card/60 border border-purple-900/50 rounded-xl p-5 flex flex-col h-[750px] lg:border-l-2 lg:border-l-purple-500/50">
            <div class="pb-3.5 border-b border-tech-border mb-4 flex items-center justify-between">
                <div>
                    <span class="text-xs text-purple-400 font-mono">SLOUPEC 03</span>
                    <h2 id="title-col-3" class="font-bold text-xl text-purple-200 uppercase truncate max-w-[280px]">Senátní obvod</h2>
                </div>
            </div>
            <div class="mb-4 relative">
                <select id="select-col-3" onchange="renderColumn(3)" class="w-full bg-tech-base border border-purple-900/60 text-sm rounded-lg p-3 text-slate-200 font-mono focus:outline-none focus:border-purple-500">
                    <option value="">-- Čekám na senátní obvody --</option>
                </select>
            </div>
            <div id="col-container-3" class="space-y-4 overflow-y-auto pr-1 flex-grow pt-2"></div>
        </section>

    </main>

    <script>
        let kvXmlData = null;
        let seXmlData = null;

        async function fetchAllData() {
            const kvUrl = document.getElementById('target-kv-url').value;
            const seUrl = document.getElementById('target-se-url').value;
            const statusEl = document.getElementById('xml-status');

            statusEl.innerText = "Stahuji aktuální XML 2026 z volby.gov.cz...";

            try {
                const kvProxy = 'https://corsproxy.io/?' + encodeURIComponent(kvUrl);
                try {
                    const kvRes = await fetch(kvProxy + '&_t=' + new Date().getTime());
                    if (kvRes.ok) {
                        const kvText = await kvRes.text();
                        kvXmlData = new DOMParser().parseFromString(kvText, "text/xml");
                    }
                } catch (kvErr) { console.error("Chyba načítání obecních dat:", kvErr); }

                const seProxy = 'https://corsproxy.io/?' + encodeURIComponent(seUrl);
                try {
                    const seRes = await fetch(seProxy + '&_t=' + new Date().getTime());
                    if (seRes.ok) {
                        const seText = await seRes.text();
                        seXmlData = new DOMParser().parseFromString(seText, "text/xml");
                    }
                } catch (seErr) { console.error("Chyba načítání senátních dat:", seErr); }

                statusEl.innerText = "Data 2026 aktualizována v " + new Date().toLocaleTimeString();
                statusEl.className = "text-sm text-tech-success font-mono";

                populateDropdowns();

            } catch (err) {
                statusEl.innerText = "Soubor na volby.gov.cz ještě není připraven nebo probíhá údržba serveru.";
                statusEl.className = "text-sm text-tech-warning font-mono";
            }
        }

        function populateDropdowns() {
            if (kvXmlData) {
                const obceNodes = kvXmlData.querySelectorAll('OBEC, ZASTUPITELSTVO');
                [1, 2].forEach(colId => {
                    const select = document.getElementById(`select-col-${colId}`);
                    const currentVal = select.value;
                    select.innerHTML = '<option value="">-- Vyberte obec --</option>';

                    obceNodes.forEach(obec => {
                        const nazev = obec.getAttribute('NAZ_OBCE') || obec.getAttribute('NAZEV') || obec.getAttribute('NAZ_ZAST');
                        const kod = obec.getAttribute('KOD_OBCE') || obec.getAttribute('KOD') || obec.getAttribute('KODZASTUP');
                        
                        if (nazev && kod) {
                            const opt = document.createElement('option');
                            opt.value = kod;
                            opt.innerText = `${nazev} (${kod})`;
                            opt.dataset.cleanName = nazev; // Uložíme si pouze čistý název obce
                            select.appendChild(opt);
                        }
                    });

                    if (currentVal) select.value = currentVal;
                });
            }

            if (seXmlData) {
                const selectSenat = document.getElementById('select-col-3');
                const currentSenatVal = selectSenat.value;
                selectSenat.innerHTML = '<option value="">-- Vyberte senátní obvod --</option>';

                const obvodyNodes = seXmlData.querySelectorAll('SENAT_OBVOD, OBVOD');
                obvodyNodes.forEach(obvod => {
                    const cislo = obvod.getAttribute('CISLO') || obvod.getAttribute('NUM');
                    const nazev = obvod.getAttribute('NAZEV') || `Obvod č. ${cislo}`;
                    
                    if (cislo) {
                        const opt = document.createElement('option');
                        opt.value = cislo;
                        opt.innerText = `Obvod č. ${cislo} (${nazev})`;
                        opt.dataset.cleanName = `Obvod č. ${cislo} (${nazev})`;
                        selectSenat.appendChild(opt);
                    }
                });

                if (currentSenatVal) selectSenat.value = currentSenatVal;
            }

            renderColumn(1);
            renderColumn(2);
            renderColumn(3);
        }

        function renderColumn(colId) {
            const select = document.getElementById(`select-col-${colId}`);
            const container = document.getElementById(`col-container-${colId}`);
            const titleEl = document.getElementById(`title-col-${colId}`);
            const selectedVal = select.value;

            if (!selectedVal) {
                if (colId === 1) titleEl.innerText = "OBEC A";
                if (colId === 2) titleEl.innerText = "OBEC B";
                if (colId === 3) titleEl.innerText = "SENÁTNÍ OBVOD";

                container.innerHTML = `<div class="p-5 bg-tech-base/40 rounded border border-tech-border/40 text-center text-sm font-mono text-slate-500">Vyberte položku ze seznamu ČSÚ.</div>`;
                return;
            }

            const selectedOption = select.options[select.selectedIndex];
            const cleanName = selectedOption.dataset.cleanName || selectedOption.text;
            
            // Dynamicky přepíšeme velký nadpis sloupce
            titleEl.innerText = cleanName;

            let isProcessed = false;
            let resultsHtml = '';

            const xmlSource = (colId === 3) ? seXmlData : kvXmlData;

            if (xmlSource) {
                const targetNode = xmlSource.querySelector(`OBEC[KOD_OBCE="${selectedVal}"], OBEC[KOD="${selectedVal}"], ZASTUPITELSTVO[KODZASTUP="${selectedVal}"], SENAT_OBVOD[CISLO="${selectedVal}"]`);
                
                if (targetNode) {
                    const položky = targetNode.querySelectorAll('STRANA, KANDIDAT, KAND_LISTINA');
                    if (položky.length > 0) {
                        isProcessed = true;
                        resultsHtml = Array.from(položky).map(s => {
                            const nazev = s.getAttribute('NAZ_STR') || s.getAttribute('JMENO') || s.getAttribute('NAZ_KL') || 'Kandidát / Strana';
                            const proc = s.getAttribute('PROC_HLASU') || s.getAttribute('PROC') || '0';
                            const hlasy = s.getAttribute('HLASY') || '0';
                            const mandaty = s.getAttribute('MANDATY') || s.getAttribute('MAND') || null;

                            return `
                                <div class="mb-2.5">
                                    <div class="flex justify-between text-sm font-mono mb-1.5">
                                        <span class="text-slate-300 font-semibold">${nazev}</span>
                                        <span class="text-slate-400">${proc}% <span class="text-slate-500">(${hlasy} h.${mandaty ? ' | Mandáty: ' + mandaty : ''})</span></span>
                                    </div>
                                    <div class="w-full h-2 bg-tech-base rounded-full overflow-hidden">
                                        <div class="h-full ${colId === 3 ? 'bg-purple-500' : 'bg-tech-accent'} rounded-full" style="width: ${proc}%"></div>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    }
                }
            }

            if (isProcessed) {
                container.innerHTML = `
                    <div class="tech-glow-card bg-tech-base/80 p-5 rounded-lg">
                        <div class="flex justify-between items-center mb-3.5">
                            <h3 class="font-bold text-base text-slate-100">${cleanName}</h3>
                            <span class="px-2.5 py-1 rounded text-xs font-mono font-semibold bg-tech-success/10 text-tech-success border border-tech-success/30">SPOČTENO</span>
                        </div>
                        <div class="space-y-2 mt-4">${resultsHtml}</div>
                    </div>`;
            } else {
                container.innerHTML = `
                    <div class="tech-glow-card bg-
